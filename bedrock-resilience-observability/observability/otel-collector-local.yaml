receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

exporters:
  awsxray/localstack:
    endpoint: http://localhost:4566
    region: us-east-1
    local_mode: true
    indexed_attributes: [model_id, operation, error_type, throttled]
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsxray/localstack, debug]
