server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: canary-control-plane
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  service-name: ${SERVICE_NAME:payment-api}
  stable-version: ${STABLE_VERSION:stable-v1}
  candidate-version: ${CANDIDATE_VERSION:candidate-v2}
  routing-table: ${ROUTING_TABLE:canary-routing-state}
  release-table: ${RELEASE_TABLE:canary-releases}
  event-bus-name: ${EVENT_BUS_NAME:canary-release-bus}
  cloudwatch-namespace: ${CLOUDWATCH_NAMESPACE:CanaryDemo/PaymentAPI}
  evaluation-window-seconds: ${EVALUATION_WINDOW_SECONDS:10}
  stable-url: ${STABLE_URL:http://localhost:8081}
  candidate-url: ${CANDIDATE_URL:http://localhost:8082}
aws:
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
