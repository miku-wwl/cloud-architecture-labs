<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Canary Release Orchestrator</title>
    <style>
        body{font-family:system-ui,sans-serif;max-width:1050px;margin:2rem auto;padding:0 1rem;background:#f7f8fa;color:#182230}
        h1{margin-bottom:.25rem}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
        .card{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:1rem;box-shadow:0 2px 7px #1018280d}.value{font-size:1.5rem;font-weight:700;margin-top:.4rem}
        button{border:0;border-radius:7px;padding:.65rem 1rem;margin:.25rem;cursor:pointer;background:#175cd3;color:white}button.secondary{background:#475467}
        pre{white-space:pre-wrap;background:#101828;color:#e6eaf0;padding:1rem;border-radius:8px;min-height:4rem}
    </style>
</head>
<body>
<h1>Canary Release Orchestrator</h1><p class="muted">Payment API progressive delivery control plane</p>
<div class="grid">
  <section class="card"><div>Stable version</div><div class="value" id="stable">-</div></section>
  <section class="card"><div>Candidate version</div><div class="value" id="candidate">-</div></section>
  <section class="card"><div>Candidate traffic</div><div class="value" id="percentage">-</div></section>
  <section class="card"><div>Release status / stage</div><div class="value" id="status">-</div></section>
</div>
<section class="card" style="margin-top:1rem"><h2>Demo controls</h2>
  <button onclick="traffic('/api/demo/traffic/start?rps=30')">Start Traffic (30 RPS)</button>
  <button class="secondary" onclick="traffic('/api/demo/traffic/stop')">Stop Traffic</button>
  <button onclick="release('HEALTHY')">Start Healthy Release</button>
  <button onclick="release('ERROR')">Start Error Release</button>
  <button onclick="release('SLOW')">Start Slow Release</button>
  <button class="secondary" onclick="resetDemo()">Reset Demo</button>
</section>
<div class="grid" style="margin-top:1rem"><section class="card"><h2>Stable metrics</h2><pre id="stableMetrics">-</pre></section><section class="card"><h2>Candidate metrics</h2><pre id="candidateMetrics">-</pre></section></div>
<section class="card" style="margin-top:1rem"><h2>Recent release</h2><pre id="release">-</pre></section>
<script>
const $=id=>document.getElementById(id);
async function refresh(){const r=await fetch('/api/dashboard');if(!r.ok)return;const d=await r.json(),x=d.routing||{};$('stable').textContent=x.stableVersion||'-';$('candidate').textContent=x.candidateVersion||'-';$('percentage').textContent=(x.candidatePercentage??0)+'%';const q=d.recentRelease;$('status').textContent=q?(q.status+' / '+q.currentStage):'IDLE';$('stableMetrics').textContent=JSON.stringify(d.stableMetrics,null,2);$('candidateMetrics').textContent=JSON.stringify(d.candidateMetrics,null,2);$('release').textContent=JSON.stringify(q,null,2);}
async function traffic(path){await fetch(path,{method:'POST'});refresh()} async function resetDemo(){await fetch('/api/demo/reset',{method:'POST'});refresh()}
async function release(scenario){const r=await fetch('/api/releases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidateVersion:'candidate-v2',scenario})});const b=await r.json();if(!r.ok)alert(b.detail||b.error||'Release could not start');refresh()}
refresh();setInterval(refresh,2000);
</script>
</body></html>
