server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: payment-service
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
app:
  version: ${APP_VERSION:payment-local}
  fault-mode: ${FAULT_MODE:HEALTHY}
